<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Spring Boot 4</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">🔒</span>
                <h1>Change Password</h1>
            </div>
            <p class="subtitle">Secure Your Account</p>
        </header>

        <main class="main-content">
            <div class="glass-card">
                <div class="card-header">
                    <h2>Update Account Password</h2>
                </div>

                <form th:action="@{/user/password}" th:object="${passwordDto}" method="post" class="needs-validation">
                    
                    <!-- Current Password -->
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label text-light">Current Password</label>
                        <input type="password" th:field="*{currentPassword}" id="currentPassword" class="form-control search-input" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" placeholder="Enter your current password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">Current Password Error</div>
                    </div>

                    <!-- New Password -->
                    <div class="mb-3">
                        <label for="newPassword" class="form-label text-light">New Password</label>
                        <input type="password" th:field="*{newPassword}" id="newPassword" class="form-control search-input" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" placeholder="Enter new password (min. 8 characters)">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">New Password Error</div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label text-light">Confirm New Password</label>
                        <input type="password" th:field="*{confirmPassword}" id="confirmPassword" class="form-control search-input" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" placeholder="Confirm your new password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirmation Error</div>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a th:href="@{/products}" class="btn btn-secondary reset-button">Cancel</a>
                        <button type="submit" class="btn btn-primary search-button">Change Password</button>
                    </div>

                </form>
            </div>
        </main>

        <!-- Replace with common footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</body>
</html>
