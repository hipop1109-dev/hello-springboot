<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Spring Boot 4</title>
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">📦</span>
                <h1>Product Catalog</h1>
            </div>
            <p class="subtitle">Spring Boot 4 · Security 7 · JPA Practice Project</p>
        </header>

        <main class="main-content">
            <div class="glass-card">
                <div class="card-header">
                    <h2>Available Products</h2>
                    <span class="badge" th:text="${products.size() + ' Items'}">0 Items</span>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="4" class="no-data">No products found. Add some products using the REST API!</td>
                            </tr>
                            <tr th:each="product : ${products}" class="product-row">
                                <td class="product-id" th:text="${product.id}">1</td>
                                <td class="product-name" th:text="${product.name}">Product Name</td>
                                <td class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' ₩'}">10,000 ₩</td>
                                <td class="product-desc" th:text="${product.description}">Product Description</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Replace with common footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</body>
</html>
