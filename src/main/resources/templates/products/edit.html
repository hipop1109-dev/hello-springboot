<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Spring Boot 4</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">✏️</span>
                <h1>Edit Product</h1>
            </div>
            <p class="subtitle">Admin Management Area</p>
        </header>

        <main class="main-content">
            <div class="glass-card">
                <div class="card-header">
                    <h2>Modify Product Details</h2>
                    <span class="badge" th:text="${'Product ID: ' + productId}">ID: 1</span>
                </div>

                <form th:action="@{/products/{id}/edit(id=${productId})}" th:object="${product}" method="post" class="needs-validation">
                    
                    <!-- Name Input -->
                    <div class="mb-3">
                        <label for="name" class="form-label text-light">Product Name</label>
                        <input type="text" th:field="*{name}" id="name" class="form-control search-input" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="Enter product name">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
                    </div>

                    <!-- Price Input -->
                    <div class="mb-3">
                        <label for="price" class="form-label text-light">Price (₩)</label>
                        <input type="number" th:field="*{price}" id="price" class="form-control search-input" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" placeholder="Enter product price">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</div>
                    </div>

                    <!-- Stock Input -->
                    <div class="mb-3">
                        <label for="stock" class="form-label text-light">Stock Count</label>
                        <input type="number" th:field="*{stock}" id="stock" class="form-control search-input" th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" placeholder="Enter stock amount">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Stock Error</div>
                    </div>

                    <!-- Description Input -->
                    <div class="mb-3">
                        <label for="description" class="form-label text-light">Description</label>
                        <textarea th:field="*{description}" id="description" class="form-control search-input" rows="4" placeholder="Enter product description"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description Error</div>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a th:href="@{/products}" class="btn btn-secondary reset-button">Cancel</a>
                        <button type="submit" class="btn btn-primary search-button">Save Changes</button>
                    </div>

                </form>
            </div>
        </main>

        <!-- Replace with common footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</body>
</html>
